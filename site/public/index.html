<body>
<div class="app-shell" style="--page-width: 1240px">

  <header class="topbar is-split">
    <a class="wordmark" href="/">
      <span class="mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
      </span>
      <em>harness</em>.racer
    </a>
    <nav class="cn-row">
      <a class="btn btn-secondary is-sm" href="https://www.npmjs.com/package/harness-racer" data-outbound="npm">npm</a>
      <a class="btn btn-secondary is-sm" href="https://github.com/BalajiLeninrajan/harness-racer" data-outbound="github">GitHub</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="hero">
      <div class="cn-microlabel cn-text-mauve">Local harness benchmark</div>
      <h1 class="display-title">Race the agent CLIs already on your <em>machine</em>.</h1>

      <div class="cn-cluster cn-mt-24 cn-mb-32">
        <span class="chip">Codex CLI</span><span class="chip">Claude Code</span><span class="chip">Cursor Agent</span><span class="chip">Grok CLI</span><span class="chip">OpenCode</span>
      </div>

      <div class="command" id="command">
        <code class="command-text" id="cmd"><span class="command-prompt">$</span>npx harness-racer</code>
        <button
          class="btn is-icon command-copy"
          id="copy"
          type="button"
          data-command="npx harness-racer"
          data-tip="Copy"
          aria-label="Copy the install command"
        >
          <svg
            class="copy-glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="9" y="9" width="11" height="11" rx="2.5" />
            <path d="M5 15V5.5A2.5 2.5 0 0 1 7.5 3H15" />
          </svg>
          <svg
            class="done-glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
      </div>
    </section>

    <!-- Four accent streaks racing the width of the page. Decorative. On wide
         screens they sit behind the hero and the scrim holds the copy legible
         over them; below 760px they drop into flow underneath it and the
         scrim goes away. Same animation either way — only the placement
         changes. Ordered after the hero so the flow version needs no reorder. -->
    <div class="field" aria-hidden="true">
      <span class="streak" style="--accent: var(--teal)"></span>
      <span class="streak" style="--accent: var(--mauve)"></span>
      <span class="streak" style="--accent: var(--yellow)"></span>
      <span class="streak" style="--accent: var(--blue)"></span>
    </div>
    <div class="scrim" aria-hidden="true"></div>
  </main>

  <footer class="page-footer">
    <span class="wordmark is-sm"><em>harness</em>.racer<span>MIT licensed</span></span>
    <span>Made in Waterloo</span>
  </footer>

</div>

<script src="/copy.js"></script>
<script>
  // The npm and GitHub buttons are the page's only ways out.
  document.querySelectorAll("[data-outbound]").forEach(function (a) {
    a.addEventListener("click", function () {
      posthog.capture("outbound_link", { destination: a.getAttribute("data-outbound"), location: "header" });
    });
  });
</script>
</body>
</html>
