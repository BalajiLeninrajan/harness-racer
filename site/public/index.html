<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harness Racer — race your local coding agents</title>
<meta name="description" content="Race the coding-agent stacks already installed on your machine. Cold start, first output, visible tokens per second — streamed live." />
<meta name="theme-color" content="#11111b" />
<meta property="og:title" content="Harness Racer" />
<meta property="og:description" content="Race the coding-agent stacks already installed on your machine." />
<meta property="og:type" content="website" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" />
<!-- catppuccin-neu design system, served from jsDelivr. Bump the tag here when the app's package.json pin changes. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v0.3.1/css/index.css" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app-shell" style="--page-width: 1240px">

  <header class="topbar is-split">
    <a class="wordmark" href="/">
      <span class="mark-solid" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
      </span>
      <em>harness</em>.racer
    </a>
    <nav class="cn-row">
      <a class="btn btn-secondary is-sm" href="https://www.npmjs.com/package/harness-racer">npm</a>
      <a class="btn btn-secondary is-sm" href="https://github.com/BalajiLeninrajan/harness-racer">GitHub</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="hero">
      <div class="eyebrow">LOCAL HARNESS BENCHMARK</div>
      <h1 class="display-title">Race the agents already on your <em>machine</em>.</h1>

      <div class="cn-cluster cn-mt-22 cn-mb-28">
        <span class="chip">Codex</span><span class="chip">Claude Code</span><span class="chip">Cursor</span><span class="chip">Grok</span><span class="chip">OpenCode</span>
      </div>

      <div class="command" id="command">
        <code class="command-text" id="cmd"><span class="command-prompt">$</span>npx harness-racer</code>
        <button
          class="btn-icon command-copy"
          id="copy"
          type="button"
          data-command="npx harness-racer"
          data-tip="Copy"
          aria-label="Copy the install command"
        >
          <svg
            class="copy-glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="9" y="9" width="11" height="11" rx="2.5" />
            <path d="M5 15V5.5A2.5 2.5 0 0 1 7.5 3H15" />
          </svg>
          <svg
            class="done-glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
      </div>
    </section>

    <!-- Four accent streaks racing the width of the page. Decorative. On wide
         screens they sit behind the hero and the scrim holds the copy legible
         over them; below 760px they drop into flow underneath it and the
         scrim goes away. Same animation either way — only the placement
         changes. Ordered after the hero so the flow version needs no reorder. -->
    <div class="field" aria-hidden="true">
      <span class="streak" style="--accent: var(--teal)"></span>
      <span class="streak" style="--accent: var(--mauve)"></span>
      <span class="streak" style="--accent: var(--yellow)"></span>
      <span class="streak" style="--accent: var(--blue)"></span>
    </div>
    <div class="scrim" aria-hidden="true"></div>
  </main>

  <footer class="footer-neu">
    <span class="footer-brand"><strong class="cn-name"><em>harness</em>.racer</strong><span>MIT licensed</span></span>
    <span>Made with 💜 in Waterloo</span>
  </footer>

</div>

<script src="/copy.js"></script>
</body>
</html>
